[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pickme"
version = "0.1.0"
description = "Telegram bot for group-chat summarization, per-user memory, evaluation and grounded Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "aiosqlite>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/pickme"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "pickme/migrations"

[tool.hatch.build.targets.sdist.force-include]
"migrations" = "pickme/migrations"
